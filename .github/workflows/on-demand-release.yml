name: On-Demand Release

# Thin wrapper over scripts/release.mjs. The script owns preflight, version
# bumping, CHANGELOG rolling, the commit, and the tag; this workflow supplies
# credentials and publishes the Docker images and GitHub Release the script
# says this scope needs.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - client
          - server
      version_bump:
        description: 'Override the level (blank = infer)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      dry_run:
        description: 'Plan only — write nothing, publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release (${{ inputs.scope }})
    runs-on: ubuntu-latest

    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      SERVER_IMAGE_NAME: opencalendar-server
      CLIENT_IMAGE_NAME: opencalendar-client

    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      artifacts: ${{ steps.release.outputs.artifacts }}

    steps:
      - name: Guard — must run on main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "❌ Aborted: releases run from main. Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------
      # Plan — resolve versions, tag, and artifact list before touching anything
      # ---------------------------------------------------------------------
      - name: Resolve release plan
        id: plan
        run: |
          BUMP_ARG=""
          [[ -n "${{ inputs.version_bump }}" ]] && BUMP_ARG="--bump ${{ inputs.version_bump }}"
          node scripts/release.mjs "${{ inputs.scope }}" $BUMP_ARG --json | tee release-plan.json
          echo "artifacts=$(jq -r '.artifacts | join(",")' release-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Summarize plan
        run: |
          {
            echo "### Release plan"
            echo
            echo "- **Scope:** ${{ inputs.scope }}"
            echo "- **Tag:** $(jq -r .tag release-plan.json)"
            echo "- **Artifacts:** ${{ steps.plan.outputs.artifacts }}"
            echo
            jq -r '.packages[] | "- `\(.key)`: \(.currentVersion) → \(.nextVersion) (\(.level))"' release-plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Tests — fail before anything is published or tagged
      # ---------------------------------------------------------------------
      - name: Lint
        run: npm run lint

      - name: Build shared (required by server & client)
        run: npx tsc -b packages/shared/tsconfig.json --force

      - name: Typecheck server
        if: contains(steps.plan.outputs.artifacts, 'docker-server')
        run: npx tsc --noEmit -p packages/server/tsconfig.json

      - name: Typecheck client
        if: contains(steps.plan.outputs.artifacts, 'docker-client')
        run: npx tsc --noEmit -p packages/client/tsconfig.json

      - name: Run server tests
        if: contains(steps.plan.outputs.artifacts, 'docker-server')
        run: npm run test -w @opencalendar/server

      # ---------------------------------------------------------------------
      # Release — bump, changelog, commit, tag, push (the script does all of it)
      # ---------------------------------------------------------------------
      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          BUMP_ARG=""
          [[ -n "${{ inputs.version_bump }}" ]] && BUMP_ARG="--bump ${{ inputs.version_bump }}"
          node scripts/release.mjs "${{ inputs.scope }}" $BUMP_ARG
          echo "✅ Dry run complete — nothing written, nothing published."

      - name: Cut the release
        id: release
        if: '!inputs.dry_run'
        run: |
          BUMP_ARG=""
          [[ -n "${{ inputs.version_bump }}" ]] && BUMP_ARG="--bump ${{ inputs.version_bump }}"
          node scripts/release.mjs "${{ inputs.scope }}" $BUMP_ARG --apply --ci

      # ---------------------------------------------------------------------
      # Publish — Docker
      # ---------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: '!inputs.dry_run'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: '!inputs.dry_run'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push server image
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-server'')'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.release.outputs.release_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.SERVER_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build and push client image
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-client'')'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.release.outputs.release_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.CLIENT_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      # ---------------------------------------------------------------------
      # GitHub Release — notes come straight from the script
      # ---------------------------------------------------------------------
      - name: Create GitHub Release
        id: gh_release
        if: '!inputs.dry_run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: Release ${{ steps.release.outputs.release_tag }}
          body: ${{ steps.release.outputs.release_notes }}
          draft: false
          prerelease: false

      - name: Summary
        if: '!inputs.dry_run'
        run: |
          {
            echo "### Released ${{ steps.release.outputs.release_tag }}"
            echo
            echo "- **Artifacts:** ${{ steps.release.outputs.artifacts }}"
            echo "- **GitHub Release:** ${{ steps.gh_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
