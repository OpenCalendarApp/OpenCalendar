name: Docker Publish

# Continuous images for the tip of main. These are NOT release images:
#
#   :edge          always the newest green main
#   :main-<sha>    an immutable handle on one commit
#
#   :latest        the newest *release* — moved only by release.yml and
#                  on-demand-release.yml, never from here
#   :<version>     a released version — same
#
# A release pushes its commit and its tag together. If a release tag points at
# this commit, release.yml (or on-demand-release.yml) is building the real
# images — building edge images for the same commit would be wasted work and
# a second push of the same layers.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/client/**'
      - 'packages/server/**'
      - 'packages/shared/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  SERVER_IMAGE_NAME: opencalendar-server
  CLIENT_IMAGE_NAME: opencalendar-client

jobs:
  guard:
    name: Check for a release tag
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when this commit is a release
        id: check
        run: |
          TAGS=$(git tag --points-at HEAD)
          RELEASE_TAG=$(echo "$TAGS" | grep -E '^v[0-9]{4}[.-][0-9]{2}[.-][0-9]{2}' || true)

          if [[ -n "$RELEASE_TAG" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Commit carries release tag(s): $RELEASE_TAG — release.yml owns this build."
            echo "### Skipped — release commit, handled by release.yml" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "▶️ Ordinary main commit — publishing edge images."
          fi

  build-and-push:
    name: Build & Push Edge Images
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: packages/server/Dockerfile
            image_name_env: SERVER_IMAGE_NAME
            title: OpenCalendar Server
          - component: client
            dockerfile: packages/client/Dockerfile
            image_name_env: CLIENT_IMAGE_NAME
            title: OpenCalendar Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve image name
        id: image
        run: echo "name=${{ env.ACR_LOGIN_SERVER }}/${{ env[matrix.image_name_env] }}" >> "$GITHUB_OUTPUT"

      # Deliberately no `latest` and no bare version — those mark releases.
      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:main-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.title }} — edge"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}:edge"
            echo "${{ steps.image.outputs.name }}:main-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
